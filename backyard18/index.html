<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Backyard 18 — Scorecard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --turf-deep:#132a20;
    --turf:#1f4d38;
    --turf-mid:#2d6a4f;
    --cream:#f5f1e4;
    --cream-dim:#e8e1cd;
    --navy:#1d3557;
    --flag:#bc4749;
    --gold:#c9a227;
    --teal:#2a9d8f;
    --ink:#17201a;
    --line: rgba(23,32,26,0.14);
    --shadow: 0 10px 30px rgba(10,20,14,0.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(1200px 800px at 50% -10%, var(--turf-mid), var(--turf-deep) 65%);
    color:var(--cream);
    font-family:'IBM Plex Mono', ui-monospace, monospace;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces', Georgia, serif;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  #app{
    max-width:520px;
    margin:0 auto;
    padding:18px 14px 60px;
    min-height:100vh;
  }
  .brand{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
    padding-bottom:12px;
    border-bottom:1px solid rgba(245,241,228,0.18);
  }
  .brand-title{
    font-size:22px;
    color:var(--cream);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .brand-title .flagmark{width:16px;height:16px;flex:none;}
  .brand-sub{
    font-size:10.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:rgba(245,241,228,0.55);
  }
  .card{
    background:var(--cream);
    color:var(--ink);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:18px;
    margin-bottom:14px;
  }
  .btn{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:13px;
    letter-spacing:0.02em;
    border:none;
    border-radius:10px;
    padding:11px 16px;
    cursor:pointer;
    transition:transform .08s ease, filter .15s ease;
  }
  .btn:active{transform:scale(0.96);}
  .btn-primary{background:var(--navy); color:var(--cream);}
  .btn-primary:hover{filter:brightness(1.12);}
  .btn-ghost{background:transparent; color:var(--cream); border:1px solid rgba(245,241,228,0.35);}
  .btn-ghost:hover{background:rgba(245,241,228,0.08);}
  .btn-flag{background:var(--flag); color:var(--cream);}
  .btn-block{width:100%; display:block; text-align:center;}
  .row{display:flex; gap:8px;}
  .row.wrap{flex-wrap:wrap;}
  .grow{flex:1;}
  label.field-label{
    display:block;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.12em;
    color:rgba(23,32,26,0.55);
    margin-bottom:6px;
  }
  input[type=text]{
    width:100%;
    font-family:'IBM Plex Mono', monospace;
    font-size:15px;
    padding:10px 12px;
    border-radius:9px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
  }
  input[type=text]:focus{outline:2px solid var(--navy); outline-offset:1px;}

  /* Setup screen */
  .player-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 0;
    border-bottom:1px solid var(--line);
  }
  .player-row:last-child{border-bottom:none;}
  .swatch{width:14px;height:14px;border-radius:50%; flex:none;}
  .opp-toggle{
    display:flex; gap:8px; margin:10px 0 4px;
  }
  .opp-toggle button{
    flex:1;
    padding:10px 0;
    border-radius:9px;
    border:1px solid var(--line);
    background:#fff;
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    cursor:pointer;
    color:var(--ink);
  }
  .opp-toggle button.active{
    background:var(--navy); color:var(--cream); border-color:var(--navy);
  }

  /* Hole strip nav */
  .hole-strip{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding:4px 2px 12px;
    margin-bottom:6px;
  }
  .hole-dot{
    flex:none;
    width:30px;height:30px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:600;
    background:rgba(245,241,228,0.12);
    color:rgba(245,241,228,0.65);
    border:1px solid rgba(245,241,228,0.2);
    cursor:pointer;
  }
  .hole-dot.filled{background:var(--gold); color:var(--ink); border-color:var(--gold);}
  .hole-dot.current{outline:2px solid var(--flag); outline-offset:2px;}

  /* Hole play card */
  .hole-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:6px;
  }
  .hole-num{font-size:40px; line-height:1; color:var(--turf-deep);}
  .hole-meta{text-align:right; font-size:11px; color:rgba(23,32,26,0.6); line-height:1.6;}
  .hole-meta b{color:var(--ink);}
  .format-pill{
    display:inline-block;
    font-size:10.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:4px 9px;
    border-radius:999px;
    margin:6px 0 10px;
    font-weight:600;
  }
  .format-pill.p3{background:rgba(201,162,39,0.18); color:#8a6d10;}
  .format-pill.p4{background:rgba(29,53,87,0.12); color:var(--navy);}
  .format-pill.p5{background:rgba(188,71,73,0.14); color:var(--flag);}
  .format-rule{font-size:12.5px; color:rgba(23,32,26,0.75); line-height:1.5; margin-bottom:14px;}
  .diagram-wrap{display:flex; justify-content:center; margin:4px 0 14px;}

  .score-line{
    display:flex; align-items:center; gap:10px;
    padding:10px 0;
    border-top:1px solid var(--line);
  }
  .score-line:first-of-type{border-top:none;}
  .pname{flex:1; font-size:14px; font-weight:600; display:flex; align-items:center; gap:8px;}
  .stepper{display:flex; align-items:center; gap:10px;}
  .stepbtn{
    width:34px;height:34px;border-radius:9px;
    border:1px solid var(--line);
    background:#fff;
    font-size:18px; font-weight:700;
    cursor:pointer;
    color:var(--ink);
    line-height:1;
  }
  .stepbtn:active{background:var(--cream-dim);}
  .scoreval{
    width:30px; text-align:center; font-size:18px; font-weight:700;
  }

  .nav-buttons{display:flex; gap:8px; margin-top:16px;}

  /* Scorecard table */
  .tabs{display:flex; gap:6px; margin-bottom:12px;}
  .tab{
    flex:1; text-align:center; padding:9px 0;
    border-radius:9px; cursor:pointer;
    font-size:12px; font-weight:600; letter-spacing:0.03em;
    background:rgba(245,241,228,0.1);
    color:rgba(245,241,228,0.7);
    border:1px solid rgba(245,241,228,0.18);
  }
  .tab.active{background:var(--cream); color:var(--ink); border-color:var(--cream);}

  table.scoretable{border-collapse:collapse; width:100%; font-size:11.5px;}
  table.scoretable th, table.scoretable td{
    padding:5px 3px; text-align:center; min-width:22px;
  }
  table.scoretable thead th{
    color:rgba(23,32,26,0.55); font-weight:600; font-size:10px;
    text-transform:uppercase; letter-spacing:0.03em;
    border-bottom:1px solid var(--line);
  }
  table.scoretable td.rowlabel, table.scoretable th.rowlabel{
    text-align:left; font-weight:700; min-width:64px; padding-left:2px;
  }
  table.scoretable tbody tr{border-bottom:1px solid rgba(23,32,26,0.06);}
  table.scoretable td.total{font-weight:700; border-left:1px solid var(--line);}
  .scorecell{position:relative; font-weight:600;}
  .scorecell .mark{
    display:inline-flex; align-items:center; justify-content:center;
    width:20px; height:20px;
  }
  .scorecell .mark.under{border:1.5px solid var(--flag); border-radius:50%;}
  .scorecell .mark.over{border:1.5px solid var(--navy); border-radius:3px;}
  .scorecell .mark.eagle{border:1.5px solid var(--flag); border-radius:50%; box-shadow: 0 0 0 3px rgba(0,0,0,0) inset, 0 0 0 1.5px var(--flag);}
  .section-scroll{overflow-x:auto;}
  .totals-strip{
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 0; border-bottom:1px solid var(--line); font-size:13px;
  }
  .totals-strip:last-child{border-bottom:none;}
  .totals-strip .pname{font-weight:700;}
  .toparlabel{font-size:11px; color:rgba(23,32,26,0.55);}

  /* Match play */
  .match-card{margin-bottom:10px;}
  .match-status{
    font-family:'Fraunces', serif; font-weight:700; font-size:20px;
    margin:4px 0 2px;
  }
  .match-sub{font-size:11px; color:rgba(23,32,26,0.55); margin-bottom:10px;}
  .wlh{display:flex; gap:14px; font-size:12px;}
  .wlh span b{display:block; font-size:16px; font-family:'Fraunces',serif;}

  .footer-note{
    text-align:center; font-size:10.5px; color:rgba(245,241,228,0.45);
    margin-top:26px; line-height:1.6;
  }
  .empty{color:rgba(23,32,26,0.4); font-size:13px; padding:6px 0;}

  /* Rules modal */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(10,20,14,0.55);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:50; padding:0;
  }
  .modal-sheet{
    background:var(--cream); color:var(--ink);
    width:100%; max-width:520px;
    border-radius:18px 18px 0 0;
    padding:18px 18px 26px;
    box-shadow:var(--shadow);
    max-height:80vh; overflow-y:auto;
  }
  .modal-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:10px;
  }
  .rules-list{
    margin:0; padding-left:18px; list-style:disc;
  }
  .rules-list li{
    font-size:13px; line-height:1.55; margin-bottom:10px;
    color:rgba(23,32,26,0.85);
  }
  .rules-list li:last-child{margin-bottom:0;}
  @media (min-width:560px){
    .modal-backdrop{align-items:center;}
    .modal-sheet{border-radius:18px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){

  var HOLES = [
    {n:1,  par:5, hc:13, dist:30},
    {n:2,  par:4, hc:1,  dist:40},
    {n:3,  par:3, hc:7,  dist:30},
    {n:4,  par:4, hc:15, dist:35},
    {n:5,  par:3, hc:3,  dist:20},
    {n:6,  par:4, hc:5,  dist:45},
    {n:7,  par:5, hc:11, dist:30},
    {n:8,  par:4, hc:17, dist:35},
    {n:9,  par:4, hc:9,  dist:40},
    {n:10, par:4, hc:8,  dist:25},
    {n:11, par:3, hc:4,  dist:30},
    {n:12, par:5, hc:10, dist:45},
    {n:13, par:4, hc:6,  dist:50},
    {n:14, par:3, hc:12, dist:20},
    {n:15, par:4, hc:16, dist:35},
    {n:16, par:4, hc:2,  dist:30},
    {n:17, par:5, hc:18, dist:30},
    {n:18, par:4, hc:14, dist:40}
  ];

  var PLAYER_COLORS = ['#1d3557','#bc4749','#c9a227','#2a9d8f'];

  var HOUSE_RULES = [
    'Par 3 – Putting. Putt two balls from the tee. Count all putts to make both.',
    'Par 4 – Chip & Putt. Lying 2, as if a GIR was missed. Chip and 1 putt = 4/par.',
    'Par 5 – Putting. Putt three balls from the tee. Count all putts to make all three.',
    'Hitting concrete = penalty.',
    'Obstructed swing = free relief, same lie, no closer to the hole, close to the same angle.',
    'Ball ends up in the wrong hole = free drop right next to that hole, in the direction of the target hole.'
    'Place a tee marker for par 4s.  All players use this marker for all holes. Move it per hole if the group would like to',
    'On Par 4s only, you must chip with a wedge if you are on the fringe/fairway/rough for any shots in the hole.' 
  ];

  var state = {
    view: 'setup',           // setup | play | card
    cardTab: 'scorecard',    // scorecard | match
    currentHole: 1,
    numOpponents: 1,
    rulesOpen: false,
    players: [
      {id:0, name:'You'},
      {id:1, name:'Opponent 1'}
    ],
    scores: {}  // scores[holeNum][playerId] = number|null
  };

  HOLES.forEach(function(h){ state.scores[h.n] = {}; });

  function holeByNum(n){ return HOLES.filter(function(h){return h.n===n;})[0]; }

  function formatRule(par){
    if(par===3) return {label:'Putting · 2 balls', cls:'p3', rule:'Putt two balls from the tee. Score is total putts to hole out both balls (minimum 2).'};
    if(par===5) return {label:'Putting · 3 balls', cls:'p5', rule:'Putt three balls from the tee. Score is total putts to hole out all three (minimum 3).'};
    return {label:'Chip & putt', cls:'p4', rule:'Lying 2, as if a green in regulation was missed. One chip plus one putt scores par (4).'};
  }

  // Two physical greens, front nine and back nine, each with 4 cups.
  // On the actual course, the par-3/5 (putting-only) holes each have their
  // own dedicated cup and their own start spot right on the green. The
  // par-4 chip holes aim at one of the same four cups from up at the deck.
  var GREEN_OUTLINE = 'M60,40 C86,40 100,54 100,72 C100,80 96,86 92,90 ' +
    'C88,94 88,96 88,100 C88,104 88,106 92,110 C96,114 100,120 100,128 ' +
    'C100,141 86,155 60,155 C34,155 20,141 20,128 C20,120 24,114 28,110 ' +
    'C32,106 32,104 32,100 C32,96 32,94 28,90 C24,86 20,80 20,72 ' +
    'C20,54 34,40 60,40 Z';

  var FRONT_GREEN_PINS = [
    {n:5,  x:44, y:71},
    {n:7,  x:64, y:96},
    {n:1,  x:44, y:130},
    {n:3,  x:84, y:130}
  ];
  var BACK_GREEN_PINS = [
    {n:14, x:44, y:71},
    {n:17, x:64, y:96},
    {n:11, x:44, y:130},
    {n:12, x:84, y:130}
  ];
  var START_POS = {
    7:{x:84,y:140}, 1:{x:80,y:80}, 3:{x:46,y:80}, 5:{x:55,y:140},
    12:{x:52,y:62}, 11:{x:65,y:62}, 17:{x:38,y:80}, 14:{x:90,y:118}
  };

  function pinsForHole(hole){ return hole.n<=9 ? FRONT_GREEN_PINS : BACK_GREEN_PINS; }

  // Explicit cup each chip (par-4) hole aims at, since with only 4 cups
  // per green the modulo fallback below never reaches every one of them.
  // Index into that green's pin array: 0 = top-left, 1 = top-right,
  // 2 = bottom-left, 3 = bottom-right.
  var CHIP_TARGETS = {
    2:0, 4:1, 6:2, 8:3, 9:1,
    10:0, 13:2, 15:1, 16:0, 18:3
  };

  function pinIndexForHole(hole){
    var pins = pinsForHole(hole);
    for(var i=0;i<pins.length;i++){ if(pins[i].n===hole.n) return i; }
    if(CHIP_TARGETS.hasOwnProperty(hole.n)) return CHIP_TARGETS[hole.n];
    return hole.n % pins.length;
  }

  function greenGraphic(pins, activeIdx, accent, flagScale){
    flagScale = flagScale || 1;
    var svg = '<path d="'+GREEN_OUTLINE+'" fill="#dfe9df" stroke="'+accent+'" stroke-width="1.5" opacity="0.95"/>';
    pins.forEach(function(pin, i){
      var active = i===activeIdx;
      var stemLen = (active ? 22 : 12) * flagScale;
      var flagLen = (active ? 12 : 6) * flagScale;
      var flagH = (active ? 6 : 3) * flagScale;
      var col = active ? accent : 'rgba(23,32,26,0.28)';
      var dotR = (active ? 2.6 : 2) * flagScale;
      svg += '<circle cx="'+pin.x+'" cy="'+pin.y+'" r="'+dotR+'" fill="'+(active?'#17201a':col)+'"/>';
      svg += '<line x1="'+pin.x+'" y1="'+pin.y+'" x2="'+pin.x+'" y2="'+(pin.y-stemLen)+'" stroke="'+(active?'#17201a':col)+'" stroke-width="'+(active?1.5:1)+'"/>';
      svg += '<path d="M'+pin.x+' '+(pin.y-stemLen)+' L'+pin.x+' '+(pin.y-stemLen-flagH)+' L'+(pin.x+flagLen)+' '+(pin.y-stemLen-flagH/2)+' Z" fill="'+col+'"/>';
    });
    return svg;
  }

  // Par 3s and par 5s are putted from start to finish, entirely on the
  // green: show the whole green, all 4 cups, and this hole's own start
  // spot with a dashed putt line to its own cup.
  function svgGreenAllPins(hole){
    var accent = hole.par===3 ? 'var(--gold)' : 'var(--flag)';
    var pins = pinsForHole(hole);
    var activeIdx = pinIndexForHole(hole);
    var pin = pins[activeIdx];
    var start = START_POS[hole.n];
    return '<svg width="120" height="160" viewBox="0 0 120 160" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="'+GREEN_OUTLINE+'" fill="#dfe9df" stroke="'+accent+'" stroke-width="1.5" opacity="0.95"/>' +
      '<line x1="'+start.x+'" y1="'+start.y+'" x2="'+pin.x+'" y2="'+pin.y+'" stroke="'+accent+'" stroke-width="2" stroke-dasharray="4,4" opacity="0.9"/>' +
      pins.map(function(p,i){
        var active = i===activeIdx, col = active ? accent : 'rgba(23,32,26,0.28)';
        var stemLen=(active?22:12), flagLen=(active?12:6), flagH=(active?6:3), dotR=(active?2.6:2);
        return '<circle cx="'+p.x+'" cy="'+p.y+'" r="'+dotR+'" fill="'+(active?'#17201a':col)+'"/>' +
          '<line x1="'+p.x+'" y1="'+p.y+'" x2="'+p.x+'" y2="'+(p.y-stemLen)+'" stroke="'+(active?'#17201a':col)+'" stroke-width="'+(active?1.5:1)+'"/>' +
          '<path d="M'+p.x+' '+(p.y-stemLen)+' L'+p.x+' '+(p.y-stemLen-flagH)+' L'+(p.x+flagLen)+' '+(p.y-stemLen-flagH/2)+' Z" fill="'+col+'"/>';
      }).join('') +
      '<circle cx="'+start.x+'" cy="'+start.y+'" r="4" fill="var(--cream)" stroke="'+accent+'" stroke-width="2"/>' +
    '</svg>';
  }

  // Whole-yard view for chip & putt holes: tee at the top of the yard,
  // dashed line of flight the full distance down to the green, landing on
  // that hole's actual cup among the 4 on its green.
  function svgWholeYard(hole){
    var accent = 'var(--navy)';
    var pins = pinsForHole(hole);
    var pinIdx = pinIndexForHole(hole);
    var pin = pins[pinIdx];
    var scale = 0.34, tx = 60 - 60*scale, ty = 108 - 90*scale;
    var targetX = tx + pin.x*scale, targetY = ty + pin.y*scale;
    return '' +
    '<svg width="120" height="170" viewBox="0 0 120 170" xmlns="http://www.w3.org/2000/svg">' +
      '<rect x="10" y="6" width="100" height="10" fill="none" stroke="rgba(23,32,26,0.35)" stroke-width="1.5"/>' +
      '<line x1="10" y1="16" x2="10" y2="150" stroke="rgba(23,32,26,0.2)" stroke-width="1"/>' +
      '<line x1="110" y1="16" x2="110" y2="150" stroke="rgba(23,32,26,0.2)" stroke-width="1"/>' +
      '<line x1="60" y1="26" x2="'+targetX+'" y2="'+targetY+'" stroke="'+accent+'" stroke-width="2" stroke-dasharray="5,5" opacity="0.9"/>' +
      '<circle cx="60" cy="26" r="9" fill="'+accent+'"/>' +
      '<text x="60" y="30" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="700" fill="#f5f1e4">'+hole.n+'</text>' +
      '<g transform="translate('+tx+','+ty+') scale('+scale+')">' +
        greenGraphic(pins, pinIdx, accent, 2.2) +
      '</g>' +
    '</svg>';
  }

  function svgHoleDiagram(hole){
    return hole.par===4 ? svgWholeYard(hole) : svgGreenAllPins(hole);
  }

  function render(){
    var app = document.getElementById('app');
    var html = brandHeader();
    if(state.view==='setup') html += renderSetup();
    else if(state.view==='play') html += renderPlay();
    else html += renderCard();
    if(state.rulesOpen) html += renderRulesModal();
    app.innerHTML = html;
    bind();
  }

  function brandHeader(){
    return '' +
    '<div class="brand">' +
      '<div class="brand-title">' +
        '<svg class="flagmark" viewBox="0 0 24 24" fill="none"><line x1="5" y1="2" x2="5" y2="22" stroke="#f5f1e4" stroke-width="1.6"/><path d="M5 3 L19 6 L5 10 Z" fill="#bc4749"/></svg>' +
        'Backyard 18' +
      '</div>' +
      '<div class="row" style="align-items:center; gap:10px;">' +
        '<div class="brand-sub">Chip &amp; Putt Scorecard</div>' +
        '<button class="btn btn-ghost" id="toggleRules" style="padding:6px 12px; font-size:11px;">House Rules</button>' +
      '</div>' +
    '</div>';
  }

  function renderRulesModal(){
    var items = HOUSE_RULES.map(function(r){ return '<li>'+escapeHtml(r)+'</li>'; }).join('');
    return '' +
    '<div class="modal-backdrop" id="rulesBackdrop">' +
      '<div class="modal-sheet">' +
        '<div class="modal-head">' +
          '<h3 style="margin:0; font-size:17px;">House Rules</h3>' +
          '<button class="btn btn-ghost" id="closeRules" style="padding:6px 10px;">Close</button>' +
        '</div>' +
        '<ul class="rules-list">'+items+'</ul>' +
      '</div>' +
    '</div>';
  }

  // ---------- SETUP ----------
  function renderSetup(){
    var h = '<div class="card">';
    h += '<h2 style="margin:0 0 4px; font-size:19px;">Set up your round</h2>';
    h += '<p style="font-size:12.5px; color:rgba(23,32,26,0.6); margin:0 0 14px;">Name your players. Player 1 is tracked head-to-head against each opponent for match play.</p>';

    h += '<label class="field-label">Opponents</label>';
    h += '<div class="opp-toggle">';
    [0,1,2,3].forEach(function(i){
      h += '<button data-opp="'+i+'" class="'+(state.numOpponents===i?'active':'')+'">'+i+'</button>';
    });
    h += '</div>';

    h += '<div style="margin-top:14px;">';
    state.players.slice(0, state.numOpponents+1).forEach(function(p, idx){
      h += '<div class="player-row">' +
        '<span class="swatch" style="background:'+PLAYER_COLORS[idx]+'"></span>' +
        '<input type="text" data-player="'+p.id+'" value="'+escapeHtml(p.name)+'" placeholder="Player name">' +
      '</div>';
    });
    h += '</div>';

    h += '<button class="btn btn-primary btn-block" style="margin-top:16px;" id="startRound">Start round →</button>';
    h += '</div>';
    return h;
  }

  // ---------- PLAY ----------
  function renderPlay(){
    var hole = holeByNum(state.currentHole);
    var fmt = formatRule(hole.par);
    var activePlayers = state.players.slice(0, state.numOpponents+1);

    var h = '<div class="hole-strip">';
    HOLES.forEach(function(hh){
      var filled = activePlayers.every(function(p){ return typeof state.scores[hh.n][p.id] === 'number'; });
      h += '<div class="hole-dot '+(filled?'filled':'')+' '+(hh.n===state.currentHole?'current':'')+'" data-gohole="'+hh.n+'">'+hh.n+'</div>';
    });
    h += '</div>';

    h += '<div class="card">';
    h += '<div class="hole-head">' +
      '<div class="hole-num display">'+hole.n+'</div>' +
      '<div class="hole-meta">PAR <b>'+hole.par+'</b><br>HDCP <b>'+hole.hc+'</b><br>'+hole.dist+' FT</div>' +
    '</div>';
    h += '<div class="format-pill '+fmt.cls+'">'+fmt.label+'</div>';
    h += '<div class="format-rule">'+fmt.rule+'</div>';
    h += '<div class="diagram-wrap">'+svgHoleDiagram(hole)+'</div>';

    activePlayers.forEach(function(p, idx){
      var val = state.scores[hole.n][p.id];
      if(typeof val !== 'number') val = hole.par;
      h += '<div class="score-line">' +
        '<div class="pname"><span class="swatch" style="background:'+PLAYER_COLORS[idx]+'"></span>'+escapeHtml(p.name)+'</div>' +
        '<div class="stepper">' +
          '<button class="stepbtn" data-adj="-1" data-pid="'+p.id+'">−</button>' +
          '<div class="scoreval">'+val+'</div>' +
          '<button class="stepbtn" data-adj="1" data-pid="'+p.id+'">+</button>' +
        '</div>' +
      '</div>';
      state.scores[hole.n][p.id] = val;
    });

    h += '<div class="nav-buttons">';
    h += '<button class="btn btn-ghost grow" id="prevHole" '+(state.currentHole===1?'disabled style="opacity:.4"':'')+'>← Prev</button>';
    if(state.currentHole===18){
      h += '<button class="btn btn-flag grow" id="viewCard">Scorecard →</button>';
    } else {
      h += '<button class="btn btn-primary grow" id="nextHole">Next →</button>';
    }
    h += '</div>';
    h += '</div>';

    h += '<button class="btn btn-ghost btn-block" id="toCard" style="margin-top:2px;">View full scorecard</button>';
    return h;
  }

  // ---------- SCORECARD / MATCH PLAY ----------
  function totalsFor(playerId, holeList){
    var strokes=0, par=0, played=0;
    holeList.forEach(function(hh){
      var v = state.scores[hh.n][playerId];
      if(typeof v === 'number'){ strokes+=v; par+=hh.par; played++; }
    });
    return {strokes:strokes, par:par, played:played};
  }

  function renderCard(){
    var activePlayers = state.players.slice(0, state.numOpponents+1);
    var front = HOLES.slice(0,9), back = HOLES.slice(9,18);

    var h = '<div class="tabs">';
    h += '<div class="tab '+(state.cardTab==='scorecard'?'active':'')+'" data-tab="scorecard">Scorecard</div>';
    h += '<div class="tab '+(state.cardTab==='match?'?'':'')+' '+(state.cardTab==='match'?'active':'')+'" data-tab="match">Match Play</div>';
    h += '</div>';

    if(state.cardTab==='scorecard'){
      h += '<div class="card"><div class="section-scroll">';
      h += scoreTable(front, 'OUT', activePlayers);
      h += '</div></div>';
      h += '<div class="card"><div class="section-scroll">';
      h += scoreTable(back, 'IN', activePlayers);
      h += '</div></div>';

      h += '<div class="card">';
      h += '<h3 style="margin:0 0 8px; font-size:14px;">Totals</h3>';
      activePlayers.forEach(function(p, idx){
        var t = totalsFor(p.id, HOLES);
        var toPar = t.strokes - t.par;
        var toParStr = t.played===0 ? '—' : (toPar===0?'E':(toPar>0?'+'+toPar:toPar));
        h += '<div class="totals-strip">' +
          '<div class="pname"><span class="swatch" style="background:'+PLAYER_COLORS[idx]+'"></span>'+escapeHtml(p.name)+'</div>' +
          '<div style="text-align:right;">' +
            '<div style="font-size:16px; font-weight:700;">'+(t.played? t.strokes : '—')+'</div>' +
            '<div class="toparlabel">'+(t.played? t.played+'/18 · '+toParStr : 'no scores yet')+'</div>' +
          '</div>' +
        '</div>';
      });
      h += '</div>';
    } else {
      h += renderMatchPlay(activePlayers);
    }

    h += '<div class="nav-buttons">';
    h += '<button class="btn btn-ghost grow" id="backToPlay">← Back to play</button>';
    h += '<button class="btn btn-flag grow" id="resetRound">New round</button>';
    h += '</div>';
    return h;
  }

  function scoreTable(holeList, label, activePlayers){
    var h = '<table class="scoretable"><thead><tr><th class="rowlabel">Hole</th>';
    holeList.forEach(function(hh){ h += '<th>'+hh.n+'</th>'; });
    h += '<th class="total">'+label+'</th></tr>';
    h += '<tr><th class="rowlabel">Par</th>';
    var parTotal=0;
    holeList.forEach(function(hh){ h += '<th>'+hh.par+'</th>'; parTotal+=hh.par; });
    h += '<th class="total">'+parTotal+'</th></tr></thead><tbody>';

    activePlayers.forEach(function(p, idx){
      h += '<tr><td class="rowlabel"><span class="swatch" style="background:'+PLAYER_COLORS[idx]+'; display:inline-block; vertical-align:-1px;"></span> '+escapeHtml(p.name)+'</td>';
      var sum=0, any=false;
      holeList.forEach(function(hh){
        var v = state.scores[hh.n][p.id];
        if(typeof v==='number'){
          sum+=v; any=true;
          var diff = v - hh.par;
          var markCls = diff===0 ? '' : (diff<=-2 ? 'eagle' : diff<0 ? 'under' : 'over');
          h += '<td class="scorecell"><span class="mark '+markCls+'">'+v+'</span></td>';
        } else {
          h += '<td class="scorecell">–</td>';
        }
      });
      h += '<td class="total">'+(any?sum:'–')+'</td></tr>';
    });
    h += '</tbody></table>';
    return h;
  }

  function renderMatchPlay(activePlayers){
    var h = '';
    if(activePlayers.length < 2){
      h += '<div class="card"><div class="empty">Add at least one opponent on the setup screen to track match play.</div></div>';
      return h;
    }
    var p1 = activePlayers[0];
    for(var i=1;i<activePlayers.length;i++){
      var opp = activePlayers[i];
      var w=0,l=0,ha=0,thru=0;
      HOLES.forEach(function(hh){
        var a = state.scores[hh.n][p1.id], b = state.scores[hh.n][opp.id];
        if(typeof a==='number' && typeof b==='number'){
          thru++;
          if(a<b) w++; else if(b<a) l++; else ha++;
        }
      });
      var diff = w-l;
      var status;
      if(thru===0) status = 'Not started';
      else if(diff===0) status = 'All square';
      else if(diff>0) status = escapeHtml(p1.name)+' '+diff+' UP';
      else status = escapeHtml(opp.name)+' '+(-diff)+' UP';

      h += '<div class="card match-card">' +
        '<div style="font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:rgba(23,32,26,0.5);">'+escapeHtml(p1.name)+' vs '+escapeHtml(opp.name)+'</div>' +
        '<div class="match-status">'+status+'</div>' +
        '<div class="match-sub">Thru '+thru+' of 18</div>' +
        '<div class="wlh">' +
          '<span>Won<b>'+w+'</b></span>' +
          '<span>Lost<b>'+l+'</b></span>' +
          '<span>Halved<b>'+ha+'</b></span>' +
        '</div>' +
      '</div>';
    }
    return h;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // ---------- EVENTS ----------
  function bind(){
    var el;

    // setup
    document.querySelectorAll('[data-opp]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var n = parseInt(btn.getAttribute('data-opp'), 10);
        state.numOpponents = n;
        while(state.players.length < n+1){
          var idx = state.players.length;
          state.players.push({id: idx, name: 'Opponent '+idx});
        }
        render();
      });
    });
    document.querySelectorAll('[data-player]').forEach(function(inp){
      inp.addEventListener('input', function(){
        var pid = parseInt(inp.getAttribute('data-player'),10);
        var p = state.players.filter(function(pp){return pp.id===pid;})[0];
        if(p) p.name = inp.value;
      });
    });
    el = document.getElementById('startRound');
    if(el) el.addEventListener('click', function(){ state.view='play'; state.currentHole=1; render(); });

    // play
    document.querySelectorAll('[data-gohole]').forEach(function(d){
      d.addEventListener('click', function(){
        state.currentHole = parseInt(d.getAttribute('data-gohole'),10);
        render();
      });
    });
    document.querySelectorAll('[data-adj]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var pid = parseInt(btn.getAttribute('data-pid'),10);
        var delta = parseInt(btn.getAttribute('data-adj'),10);
        var hole = state.currentHole;
        var cur = state.scores[hole][pid];
        if(typeof cur !== 'number') cur = holeByNum(hole).par;
        cur = Math.max(1, cur+delta);
        state.scores[hole][pid] = cur;
        render();
      });
    });
    el = document.getElementById('prevHole');
    if(el) el.addEventListener('click', function(){ if(state.currentHole>1){ state.currentHole--; render(); } });
    el = document.getElementById('nextHole');
    if(el) el.addEventListener('click', function(){ if(state.currentHole<18){ state.currentHole++; render(); } });
    el = document.getElementById('viewCard');
    if(el) el.addEventListener('click', function(){ state.view='card'; state.cardTab='scorecard'; render(); });
    el = document.getElementById('toCard');
    if(el) el.addEventListener('click', function(){ state.view='card'; state.cardTab='scorecard'; render(); });

    // card
    document.querySelectorAll('[data-tab]').forEach(function(t){
      t.addEventListener('click', function(){ state.cardTab = t.getAttribute('data-tab'); render(); });
    });
    el = document.getElementById('backToPlay');
    if(el) el.addEventListener('click', function(){ state.view='play'; render(); });
    el = document.getElementById('resetRound');
    if(el) el.addEventListener('click', function(){
      if(confirm('Start a new round? This clears all scores.')){
        HOLES.forEach(function(hh){ state.scores[hh.n] = {}; });
        state.view='setup';
        state.currentHole=1;
        render();
      }
    });

    // rules modal — button toggles: second click hides it
    el = document.getElementById('toggleRules');
    if(el) el.addEventListener('click', function(){ state.rulesOpen = !state.rulesOpen; render(); });
    el = document.getElementById('closeRules');
    if(el) el.addEventListener('click', function(){ state.rulesOpen = false; render(); });
    el = document.getElementById('rulesBackdrop');
    if(el) el.addEventListener('click', function(e){ if(e.target.id==='rulesBackdrop'){ state.rulesOpen = false; render(); } });
  }

  render();
})();
</script>
</body>
</html>
